}

}

}

.check{

}

footer{

© 2026 Legacy Pole & Aerial Dance Studio

</footer>

<script>

function validateWaiver(){

const waiverChecked =
document.getElementById("waiverAgree").checked;

const signature =
document.getElementById("signature").value.trim();

if(!waiverChecked){
alert("Please agree to the waiver before booking.");
return;
}

if(signature === ""){
alert("Please enter your digital signature.");
return;
}

sendBooking();

}

function sendBooking(){

const name =
document.getElementById("name").value;

const phone =
document.getElementById("phone").value;

const email =
document.getElementById("email").value;

const classType =
document.getElementById("classType").value;

const day =
document.getElementById("day").value;

const packageType =
document.getElementById("package").value;

const notes =
document.getElementById("notes").value;

const signature =
document.getElementById("signature").value;

const message =
`NEW BOOKING REQUEST

Name: ${name}
Phone: ${phone}
Email: ${email}

Class: ${classType}
Date: ${day}
Package: ${packageType}

Digital Signature:
${signature}

Notes:
${notes}`;

window.open(
`https://wa.me/639063782296?text=${encodeURIComponent(message)}`,
'_blank'
);

}

</script>
