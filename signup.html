<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Information | Legacy Pole Studio</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f7f3f8;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
background:white;
padding:50px;
border-radius:25px;
width:90%;
max-width:500px;
box-shadow:0 10px 30px rgba(0,0,0,0.05);
}

h1{
font-size:48px;
margin-bottom:10px;
text-align:center;
}

p{
text-align:center;
color:#666;
margin-bottom:30px;
}

input{
width:100%;
padding:18px;
margin-bottom:20px;
border-radius:12px;
border:1px solid #ddd;
font-size:16px;
box-sizing:border-box;
}

button{
width:100%;
padding:18px;
border:none;
border-radius:50px;
background:linear-gradient(90deg,#9b4dff,#ff4db8);
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:0.9;
}

</style>
</head>
<script>

const inputs = document.querySelectorAll("input");
const button = document.getElementById("continueBtn");

function checkForm() {

    let allFilled = true;

    inputs.forEach(input => {
        if(input.value.trim() === ""){
            allFilled = false;
        }
    });

    if(allFilled){
        button.disabled = false;
        button.style.opacity = "1";
        button.style.cursor = "pointer";
    } else {
        button.disabled = true;
        button.style.opacity = "0.5";
        button.style.cursor = "not-allowed";
    }
}

inputs.forEach(input => {
    input.addEventListener("input", checkForm);
});

checkForm();

</script>
<body>

<div class="container">

<h1>Account Info</h1>

<p>Please complete your personal details.</p>

<form action="waiver.html">

<input type="text" placeholder="Full Name" required>

<input type="email" placeholder="Email Address" required>

<input type="tel" placeholder="Mobile Number" required>

<input type="text" placeholder="Emergency Contact Name">

<input type="tel" placeholder="Emergency Contact Number">

<button class="btn" id="continueBtn" disabled style="opacity:0.5;cursor:not-allowed;">
Continue
</button>

</form>

</div>
